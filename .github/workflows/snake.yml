name: Generate Snake Animation

on:
  schedule:
    # Chạy tự động vào 00:00 UTC mỗi ngày (khoảng 7h sáng VN)
    - cron: "0 0 * * *"
  
  # Cho phép kích hoạt thủ công trên tab Actions
  workflow_dispatch:
  
  # Tự chạy khi có commit mới lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Tạo mã snake từ GitHub contribution grid
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Đẩy file svg vào nhánh output
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
